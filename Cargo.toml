[package]
name = "cnrl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Enrol: the resumable member life cycle from newcomer to member"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cnrl"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clbs = { git = "https://github.com/corbet-foss/clbs", branch = "main" }
ckyh = { git = "https://github.com/corbet-foss/ckyh", branch = "main" }
crbk = { git = "https://github.com/corbet-foss/crbk", branch = "main" }
crgs = { git = "https://github.com/corbet-foss/crgs", branch = "main" }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
ed25519-dalek = "2.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
