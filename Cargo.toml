[package]
name = "cnrl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Enrol: the resumable member life cycle from newcomer to member"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cnrl.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clbs = { git = "https://git.corbet.ch/corbet-libre/clbs.git", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-libre/crbk.git", branch = "main" }
crgs = { git = "https://git.corbet.ch/corbet-libre/crgs.git", branch = "main" }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
ed25519-dalek = "3.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
webauthn-rs-proto = "0.5.5"
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main", features = ["test-authenticator"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
