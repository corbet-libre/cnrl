[package]
name = "cnrl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Enrol: the resumable member life cycle from newcomer to member"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cnrl"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clbs = { git = "https://github.com/corbet-foss/clbs", rev = "32b098c724ed6d3c7c3d9f4a7243f1032887c68c" }
cpky = { git = "https://github.com/corbet-foss/cpky", rev = "eae28c04116642816e72efd37a35f7e13f2f255a" }
crbk = { git = "https://github.com/corbet-foss/crbk", rev = "cb93c06eba8da8a01bbc18eeba4be4844d8df52e" }
crgs = { git = "https://github.com/corbet-foss/crgs", rev = "f6c19af1e8f1a55e31aec58c3dbf3f4fe1074f7b" }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "6b94dacd7fa04aa8847c62c6471a1fc5c0f6c9dc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
ed25519-dalek = "2.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
